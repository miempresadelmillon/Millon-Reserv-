<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Millon Reserv</title>
<meta name="description" content="Millon Reserv: agenda en línea para cualquier negocio. 3 días gratis.">
<meta property="og:title" content="Millon Reserv">
<meta property="og:description" content="Agenda en línea para cualquier negocio. 3 días gratis.">
<meta name="theme-color" content="#02040a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306091a'/%3E%3Cpath d='M14 48V16l18 22 18-22v32' fill='none' stroke='%23a8c8ff' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="millon-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02040a; --ink:#eef3fb; --mute:#b9c5d9; --silver:#d9e3f2; --ice:#bcd4ff;
  --blue:#5b9dff; --blue2:#2f6bff; --red:#ff3347; --red2:#ff6b78; --line:rgba(176,205,255,.17);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(ellipse 60% 50% at 78% 0%,rgba(60,110,255,.20),transparent 70%),
  radial-gradient(ellipse 45% 38% at 0% 18%,rgba(255,45,70,.13),transparent 70%),
  radial-gradient(ellipse 40% 30% at 100% 62%,rgba(255,45,70,.10),transparent 70%),
  radial-gradient(ellipse 50% 40% at 0% 55%,rgba(90,150,255,.09),transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(120,170,255,.10),transparent 70%)}
#motes{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
a{color:inherit}
.shell{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- vidrio ---------- */
.glass{position:relative;border-radius:28px;background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.012) 58%),rgba(5,8,16,.84);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(180deg,rgba(205,228,255,.6),rgba(205,228,255,0) 42%),linear-gradient(0deg,rgba(255,60,80,.5),rgba(255,60,80,0) 34%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;font:600 16px/1 "Inter Tight",system-ui,sans-serif;text-decoration:none;cursor:pointer;border:0;transition:transform .15s,box-shadow .2s,background .2s}
.btn.primary{background:linear-gradient(180deg,#f4f8ff,#adcbff 55%,#5b9dff);color:#06132a;box-shadow:0 0 0 1px rgba(230,240,255,.7) inset,0 10px 38px rgba(77,139,255,.45)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 14px 48px rgba(91,157,255,.65)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.11);border-color:rgba(255,90,110,.6);box-shadow:0 0 26px rgba(255,50,75,.28)}
.hot{background:linear-gradient(180deg,#ff8a95,#ff2e45 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,50,75,.35))}

/* ---------- navegacion ---------- */
nav{position:sticky;top:max(12px,env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:19px;letter-spacing:-.01em;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(7,10,19,.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand svg{display:block}
.brand span{color:var(--silver)}
.brand b{font-weight:600;background:linear-gradient(180deg,#fff,#8fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:-6px}
.navpill{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(7,10,19,.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.navpill a{text-decoration:none;font-size:15px;color:var(--mute);padding:9px 16px;border-radius:999px;transition:color .15s,background .15s}
.navpill a:hover{color:#fff;background:rgba(255,255,255,.07)}
.navr{display:flex;align-items:center;gap:8px}
.langs{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(7,10,19,.7);border:1px solid var(--line)}
.langs button{font:600 12px/1 "Inter Tight",system-ui,sans-serif;letter-spacing:.06em;color:var(--mute);background:none;border:0;border-radius:999px;padding:8px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{color:#06132a;background:linear-gradient(180deg,#f4f8ff,#9fc2ff)}
.navcta{padding:12px 18px;font-size:15px}
.navlogin{font-size:15px;color:var(--silver);text-decoration:none;padding:8px 10px}
.navlogin:hover{color:#fff}

/* ---------- hero ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr);gap:40px;align-items:center;padding:64px 0 36px;min-height:740px}
#jelly{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1}
.hero-copy{position:relative;z-index:2;min-width:0}
.pill{display:inline-flex;align-items:center;gap:9px;font-size:14px;color:var(--ice);padding:8px 16px 8px 12px;border-radius:999px;background:rgba(91,157,255,.10);border:1px solid rgba(140,185,255,.28);margin-bottom:26px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px 3px rgba(255,50,75,.85)}
h1{font-weight:500;font-size:clamp(36px,4.9vw,68px);line-height:1;letter-spacing:-.045em;max-width:640px;text-wrap:balance;background:linear-gradient(180deg,#ffffff 30%,#9cc2ff 115%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:24px;max-width:520px;font-size:19px;color:#d3dcec;text-shadow:0 1px 18px rgba(0,0,0,.9)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* demo de reserva */
.demo{position:relative;z-index:2;padding:22px;min-width:0}
.demo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.demo-head .name{font-weight:600;font-size:20px;letter-spacing:-.02em}
.demo-head .day{font-size:14px;color:var(--mute);margin-top:2px}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ice);border:1px solid rgba(140,185,255,.3);border-radius:999px;padding:5px 11px;white-space:nowrap;background:rgba(91,157,255,.08)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:16px;padding:8px 4px;border:1px solid rgba(170,205,255,.35);background:rgba(120,170,255,.06);color:var(--ink);font-family:inherit;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
.slot b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.slot small{font-size:12px;color:var(--mute)}
.slot:hover:not(:disabled){background:rgba(120,170,255,.16);transform:translateY(-2px)}
.slot.chosen{background:linear-gradient(180deg,#e8f1ff,#8db8ff);color:#06132a;border-color:#fff;box-shadow:0 0 28px rgba(120,175,255,.65)}
.slot.chosen small{color:#16305e}
.slot:disabled{cursor:default}
.slot.busy{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.07);color:#5b6679}
.slot.busy small{color:#4b5568}
.slot.lunch{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px);border-color:rgba(255,255,255,.07);color:#5b6679}
.slot.lunch small{color:#4b5568}
.demo-foot{margin-top:14px}
#hint{font-size:15px;color:var(--mute);min-height:24px;text-align:center}
.form{display:flex;flex-direction:column;gap:9px}
#formIntro{font-size:15px;text-align:center;color:var(--silver)}
.form input{width:100%;font:500 16px "Inter Tight",system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none}
.form input:focus{border-color:#8fb8ff;box-shadow:0 0 0 3px rgba(91,157,255,.22)}
.form input::placeholder{color:#74829a}
.form .err{font-size:14px;color:#ffb3a8;min-height:18px}
.form .ok{font:600 16px "Inter Tight",system-ui,sans-serif;border:0;border-radius:999px;padding:14px;cursor:pointer;color:#06132a;background:linear-gradient(180deg,#f4f8ff,#9fc2ff 60%,#5b9dff);box-shadow:0 8px 28px rgba(77,139,255,.4)}
.done{text-align:center;padding:6px 0}
.done .t{font-size:22px;font-weight:600;letter-spacing:-.02em}
.done .d{margin:6px 0 12px;color:var(--mute);font-size:15px}
.done button{font:500 14px "Inter Tight",system-ui,sans-serif;color:var(--ice);background:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}

/* ---------- bloques ---------- */
.block{padding:52px 0}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red2);margin-bottom:18px}
h2{font-weight:500;font-size:clamp(30px,4.1vw,56px);line-height:1.03;letter-spacing:-.04em;text-wrap:balance;background:linear-gradient(180deg,#fff 35%,#a9c8ff 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.head{max-width:820px;margin-bottom:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

.stat{padding:30px 28px;display:flex;flex-direction:column;gap:12px}
.stat .num{font-size:clamp(54px,6vw,80px);font-weight:300;line-height:1;letter-spacing:-.05em;background:linear-gradient(180deg,#fff,#8fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .tx{font-size:17px;color:var(--silver)}
.stat .src{font-size:13px;color:#6e7d95;margin-top:auto}

.plaque{padding:32px 30px;display:flex;flex-direction:column;gap:12px}
.plaque h3{font-size:25px;font-weight:500;letter-spacing:-.03em}
.plaque p{color:var(--mute)}
.fix{margin-top:auto;padding:14px 16px;border-radius:16px;background:rgba(91,157,255,.09);border:1px solid rgba(140,185,255,.22)}
.fix .lb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red2);margin-bottom:3px}
.fix .tx{color:#fff;font-weight:500}

.step{padding:30px 28px;display:flex;flex-direction:column;gap:10px;min-height:290px}
.step .rn{font-size:76px;font-weight:300;line-height:1;letter-spacing:-.06em;background:linear-gradient(180deg,#fff,rgba(143,184,255,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
.step .lb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red2)}
.step h3{font-size:23px;font-weight:500;letter-spacing:-.03em;margin-top:auto}
.step p{color:var(--mute);font-size:16px}

.panelrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;padding:28px 0}
.agenda{padding:26px}
.agenda .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.agenda .top b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.appt{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;margin-top:8px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.appt .h{font-weight:600;color:var(--ice)}
.appt .s{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.appt.blocked{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);color:#6a7890;grid-template-columns:62px minmax(0,1fr)}
.appt.blocked span:first-child{color:#6a7890}
.panelcopy{padding:36px 34px;display:flex;flex-direction:column;justify-content:center}
.panelcopy h2{margin-bottom:18px;font-size:clamp(28px,3.4vw,44px)}
.panelcopy p{color:var(--mute);max-width:460px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chips span{padding:13px 22px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--silver);font-size:17px}
.chips span:hover{border-color:rgba(160,200,255,.5);background:rgba(91,157,255,.11)}

.price{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:30px;align-items:center;padding:clamp(28px,4vw,56px);overflow:hidden}
.price::after{content:"";position:absolute;right:-8%;top:-30%;width:60%;height:160%;background:radial-gradient(closest-side,rgba(255,50,75,.22),rgba(91,157,255,.12) 60%,transparent);pointer-events:none}
.price .l{position:relative;z-index:1}
.price h2{margin-bottom:16px;font-size:clamp(28px,3.6vw,48px)}
.price p{color:var(--mute);max-width:480px}
.pr{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.amount{font-size:clamp(84px,11vw,150px);font-weight:300;line-height:.9;letter-spacing:-.07em;background:linear-gradient(180deg,#fff 20%,#7fb0ff 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.amount small{font-size:.17em;letter-spacing:0;font-weight:500;color:var(--mute);-webkit-text-fill-color:var(--mute);margin-left:4px}
.seal{width:108px;height:108px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;color:#06132a;background:radial-gradient(circle at 35% 25%,#ffd0d5,#ff5668 55%,#c4122a);color:#fff;box-shadow:0 0 0 6px rgba(255,70,90,.18),0 0 44px rgba(255,50,75,.6)}
.seal b{font-size:40px;font-weight:600;letter-spacing:-.04em}
.seal small{font-size:12px;font-weight:600;padding:0 10px}

.contact{text-align:center;padding:84px 0 70px}
.contact h2{max-width:860px;margin:0 auto 20px}
.contact p{color:var(--mute);max-width:560px;margin:0 auto 30px}
footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:26px 0 calc(34px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:#74829a;font-size:15px;text-align:center}
footer b{color:var(--silver);font-weight:600}

@media (max-width:980px){
  .navpill{display:none}
  .hero{grid-template-columns:minmax(0,1fr);padding-top:40px;min-height:0;gap:30px}
  .panelrow,.price{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  body{font-size:16px}
  nav{flex-wrap:wrap}
  .navcta{display:none}
  .demo{padding:16px}
  .slot b{font-size:16px}
  .step{min-height:0}
  .appt{grid-template-columns:54px minmax(0,1fr)}
  .appt .s{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ---------- app: reservas, panel, admin ---------- */
.appmode #motes{opacity:.5}
.app{max-width:760px;margin:0 auto;padding-bottom:40px}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 18px}
.bname{font-size:clamp(22px,5vw,32px);font-weight:600;letter-spacing:-.035em;background:linear-gradient(180deg,#fff 30%,#a9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{padding:22px;margin-bottom:14px}
.box.center,.center{text-align:center}
.stitle{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red2);margin-bottom:14px;font-weight:600}
.mute{color:var(--mute)} .small{font-size:14px}
.bigok{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 17px "Inter Tight",system-ui,sans-serif;cursor:pointer;text-align:left}
.opt span{color:var(--mute);font-size:15px;white-space:nowrap}
.opt.on{background:linear-gradient(180deg,#e8f1ff,#8db8ff);color:#06132a;border-color:#fff;box-shadow:0 0 26px rgba(120,175,255,.5)}
.opt.on span{color:#16305e}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dbtn{flex:0 0 auto;padding:11px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 15px "Inter Tight",system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-transform:capitalize}
.dbtn:disabled{opacity:.3;cursor:default}
.dbtn.on{background:linear-gradient(180deg,#e8f1ff,#8db8ff);color:#06132a;border-color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tbtn{padding:13px 6px;border-radius:14px;border:1px solid rgba(170,205,255,.35);background:rgba(120,170,255,.06);color:var(--ink);font:600 17px "Inter Tight",system-ui,sans-serif;cursor:pointer}
.tbtn:hover{background:rgba(120,170,255,.16)}
.tbtn.on{background:linear-gradient(180deg,#e8f1ff,#8db8ff);color:#06132a;border-color:#fff;box-shadow:0 0 22px rgba(120,175,255,.55)}
.appfoot{text-align:center;color:#74829a;font-size:14px;padding:18px 0}
.appfoot b{color:var(--silver)}
.note{padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:15px;border:1px solid var(--line)}
.note.ok{background:rgba(91,157,255,.12);border-color:rgba(140,185,255,.35)}
.note.bad{background:rgba(255,50,75,.12);border-color:rgba(255,90,110,.4);color:#ffd2d7}
.pill2{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);margin-left:6px}
.pill2.ok{color:#bfe0ff;border-color:rgba(140,185,255,.4)} .pill2.bad{color:#ffb3a8;border-color:rgba(255,90,110,.45)}
.bizbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:20px}
.tabs2{display:flex;gap:6px;margin-bottom:16px}
.tabs2.scroll{overflow-x:auto;padding-bottom:4px}
.tabs2 button{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mute);font:500 15px "Inter Tight",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tabs2 button.on{background:linear-gradient(180deg,#f4f8ff,#9fc2ff);color:#06132a;border-color:#fff}
.app .form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.app .form input,.app .form select{width:100%;font:500 16px "Inter Tight",system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;color-scheme:dark}
.app .form input:focus,.app .form select:focus{border-color:#8fb8ff;box-shadow:0 0 0 3px rgba(91,157,255,.22)}
.app .form{gap:12px}
.app .form small{color:#74829a}
.slugrow{display:flex;align-items:center;gap:0}
.slugrow span{padding:12px 10px 12px 14px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:rgba(255,255,255,.03);color:var(--mute)}
.slugrow input{border-radius:0 12px 12px 0!important}
.linkbtn{background:none;border:0;color:var(--ice);font:500 14px "Inter Tight",system-ui,sans-serif;cursor:pointer;text-decoration:underline;padding:4px}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.danger{border-color:rgba(255,90,110,.7);color:#ffb3a8;background:rgba(255,50,75,.12)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dlabel{display:flex;flex-direction:column;align-items:center;gap:6px}
.dlabel b::first-letter{text-transform:uppercase}
.dlabel input{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:6px 10px;font:500 14px "Inter Tight",system-ui,sans-serif;color-scheme:dark}
.agrid{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03)}
.arow.big{grid-template-columns:minmax(0,1fr);gap:8px;padding:14px}
.arow .ah{font-weight:600;color:var(--ice)}
.arow.booked{background:rgba(91,157,255,.12);border-color:rgba(140,185,255,.35)}
.arow.blocked{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px)}
.arow.cont{opacity:.55}
.arow a{color:var(--ice)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 44px;gap:8px;align-items:center}
.srow.head{order:-1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#74829a}
.srow2{display:flex;gap:8px;align-items:center;margin:8px 0 6px}
.hgrid{display:grid;grid-template-columns:minmax(110px,1.2fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.hgrid.head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#74829a}
.hgrid input[type=time]{padding:9px 6px;font-size:15px}
.hgrid .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.hgrid .chk input{width:auto}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;min-height:8px}
.chip2{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px}
.chip2 button{background:none;border:0;color:var(--red2);cursor:pointer;margin-left:4px}
.linkbox{padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed rgba(140,185,255,.4);word-break:break-all;font-size:15px;user-select:all}
.qr{display:block;margin:10px 0;border-radius:14px;background:#fff;padding:8px}
@media (max-width:560px){
  .srow{grid-template-columns:minmax(0,1fr) 64px 70px 40px;gap:6px}
  .hgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hgrid.head{display:none}
  .hgrid .chk{grid-column:1 / -1;padding-top:8px}
  .arow{grid-template-columns:48px minmax(0,1fr)}
  .arow .btn{grid-column:1 / -1;justify-self:start}
  .box{padding:16px}
}

function dayIsBookable(biz, dateStr){
  const h = biz.hours && biz.hours[parseDate(dateStr).getDay()];
  if (!h || !h.on) return false;
  if ((biz.daysOff || []).indexOf(dateStr) >= 0) return false;
  return true;
}
function bookableDays(biz){
  const out = [], base = new Date(); base.setHours(0,0,0,0);
  for (let i = 0; i < 21; i++){ const d = new Date(base.getTime() + i * 86400000); out.push(ymd(d)); }
  return out;
}
function firstOpenDate(biz, svc){
  const days = bookableDays(biz);
  for (let i = 0; i < days.length; i++) if (dayIsBookable(biz, days[i]) && computeTimes(biz, days[i], svc, {}).length) return days[i];
  for (let i = 0; i < days.length; i++) if (dayIsBookable(biz, days[i])) return days[i];
  return days[0];
}
function computeTimes(biz, dateStr, svc, taken){
  if (!svc || !dayIsBookable(biz, dateStr)) return [];
  const h = biz.hours[parseDate(dateStr).getDay()];
  const step = biz.slotMinutes || 30, open = toMin(h.open), close = toMin(h.close);
  const need = Math.max(1, Math.ceil(svc.minutes / step));
  const bs = h.bs ? toMin(h.bs) : null, be = h.be ? toMin(h.be) : null;
  const now = new Date(), isToday = dateStr === ymd(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const res = [];
  for (let t = open; t + need * step <= close; t += step){
    if (isToday && t <= nowMin) continue;
    let ok = true;
    for (let k = 0; k < need; k++){
      const m = t + k * step;
      if (bs != null && be != null && m < be && m + step > bs) { ok = false; break; }
      if (taken[fmtMin(m)]) { ok = false; break; }
    }
    if (ok) res.push(fmtMin(t));
  }
  return res;
}

async function bkConfirm(){

  bk.name = ($("bk-name") ? $("bk-name").value : bk.name).trim();

  bk.busy = true; bk.err = ""; bookRender();
  const biz = bk.biz, step = biz.slotMinutes || 30, need = Math.max(1, Math.ceil(bk.svc.minutes / step)), start = toMin(bk.time);
  const db = FB.db, batch = db.batch(), base = "businesses/" + bk.slug;
  const bref = db.collection(base + "/bookings").doc();
  const ids = [];
  for (let k = 0; k < need; k++){
    const hhmm = fmtMin(start + k * step), id = slotKey(bk.date, hhmm);
    ids.push(id);
    batch.set(db.doc(base + "/slots/" + id), {date: bk.date, time: hhmm, kind: "booking"});
  }
  batch.set(bref, {name: bk.name.slice(0, 60), phone: bk.phone.slice(0, 30), serviceId: bk.svc.id, serviceName: bk.svc.name, minutes: bk.svc.minutes, price: bk.svc.price, date: bk.date, time: bk.time, slotIds: ids, status: "ok", createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  try {
    await batch.commit();
    bk.done = {name: bk.name, date: bk.date, time: bk.time, svc: bk.svc.name};
    bk.time = null; bk.name = ""; bk.phone = "";
  } catch (e) {
    try { await bkLoadTaken(); } catch (e2) {}
    bk.time = null;
    bk.err = (e && e.code === "permission-denied") ? t.taken : t.fail;
  }
  bk.busy = false;
  bookRender();
}

function authErr(e){
  const c = e && e.code || "";
  if (c.indexOf("email-already") >= 0) return "Ese correo ya tiene cuenta. Entra con tu contraseña.";
  if (c.indexOf("weak-password") >= 0) return "La contraseña es muy corta (mínimo 6 caracteres).";
  if (c.indexOf("invalid-email") >= 0) return "El correo no es válido.";
  if (c.indexOf("user-not-found") >= 0 || c.indexOf("wrong-password") >= 0 || c.indexOf("invalid-credential") >= 0 || c.indexOf("invalid-login") >= 0) return "Correo o contraseña incorrectos.";
  if (c.indexOf("too-many") >= 0) return "Demasiados intentos. Espera unos minutos.";
  if (c.indexOf("network") >= 0) return "Sin conexión. Revisa tu internet.";
  if (c.indexOf("permission") >= 0) return "No tienes permiso para esta acción.";
  return "Algo falló. Intenta otra vez.";
}

async function panelSubmit(e){
  const f = e.target; e.preventDefault();
  if (f.id === "fAuth"){
    const reg = P.mode === "register", em = f.elements.email.value.trim(), pw = f.elements.pass.value; P.email = em;
    try {
      if (reg){
        const bname = f.elements.bname.value.trim(), slug = f.elements.slug.value.trim().toLowerCase();
        const err = validSlug(slug); if (err){ say(err, "bad"); return panelRender(); }
        const ex = await FB.db.doc("businesses/" + slug).get();
        if (ex.exists){ say("Ese enlace ya está en uso. Prueba otro nombre.", "bad"); return panelRender(); }
        P.registering = true;
        let cred;
        try { cred = await FB.auth.createUserWithEmailAndPassword(em, pw); } catch (er0) { P.registering = false; throw er0; }
        try {
          await FB.db.doc("businesses/" + slug).set(defaultBiz(cred.user.uid, em, bname, slug));
          P.bizId = slug; P.biz = defaultBiz(cred.user.uid, em, bname, slug); P.biz.trialEnd = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 3 * 86400000)); P.biz.createdAt = null;
          P.user = cred.user; P.tab = "enlace"; say("¡Listo! Tu agenda está creada. Tienes 3 días gratis.", "ok"); await loadDay();
        } catch (er2) { P.user = cred.user; say(authErr(er2), "bad"); }
        P.registering = false;
        panelRender();
      } else {
        await FB.auth.signInWithEmailAndPassword(em, pw); say("");
      }
    } catch (er) { say(authErr(er), "bad"); panelRender(); }
  }
  else if (f.id === "fCreate"){
    const bname = f.elements.bname.value.trim(), slug = f.elements.slug.value.trim().toLowerCase();
    const err = validSlug(slug); if (err){ say(err, "bad"); return panelRender(); }
    try {
      const ex = await FB.db.doc("businesses/" + slug).get();
      if (ex.exists){ say("Ese enlace ya está en uso. Prueba otro.", "bad"); return panelRender(); }
      const data = defaultBiz(P.user.uid, P.user.email, bname, slug);
      await FB.db.doc("businesses/" + slug).set(data);
      P.bizId = slug; P.biz = data; P.tab = "enlace"; say("¡Listo! Tu agenda está creada.", "ok"); await loadDay();
    } catch (er) { say(authErr(er), "bad"); }
    panelRender();
  }
  else if (f.id === "fSvc"){
    const list = readSvcForm(), step = P.biz.slotMinutes || 30;
    if (!list.length){ say("Añade al menos un servicio.", "bad"); return panelRender(); }
    for (let i = 0; i < list.length; i++){
      const s = list[i];
      if (!s.name || !(s.minutes >= 5) || !(s.price >= 0)){ say("Revisa los servicios: nombre, minutos y precio.", "bad"); P.svcDraft = list; return panelRender(); }
      if (Math.ceil(s.minutes / step) > 4){ say("“" + s.name + "” dura demasiado para turnos de " + step + " min (máximo " + (4 * step) + " min). Sube la duración del turno en Horario o acorta el servicio.", "bad"); P.svcDraft = list; return panelRender(); }
    }
    P.svcDraft = null; await saveBiz({services: list}, "Servicios guardados.");
  }
  else if (f.id === "fHours"){
    const hours = {};
    for (let d = 0; d < 7; d++){
      hours[d] = {on: f.elements["on" + d].checked, open: f.elements["o" + d].value || "09:00", close: f.elements["c" + d].value || "18:00", bs: f.elements["bs" + d].value || "", be: f.elements["be" + d].value || ""};
      if (hours[d].on && toMin(hours[d].open) >= toMin(hours[d].close)){ say(DAYNAMES[d] + ": la hora de cierre debe ser después de la de apertura.", "bad"); return panelRender(); }
      if ((hours[d].bs && !hours[d].be) || (!hours[d].bs && hours[d].be)){ say(DAYNAMES[d] + ": completa el descanso (de / a) o déjalo vacío.", "bad"); return panelRender(); }
    }
    const slotMinutes = +f.elements.slotMinutes.value;
    const tooLong = (P.biz.services || []).filter(function(s){ return Math.ceil(s.minutes / slotMinutes) > 4; })[0];
    if (tooLong){ say("“" + tooLong.name + "” dura demasiado para turnos de " + slotMinutes + " min. Elige un turno más largo o acorta el servicio.", "bad"); return panelRender(); }
    await saveBiz({hours: hours, slotMinutes: slotMinutes}, "Horario guardado."); await loadDay(); panelRender();
  }
  else if (f.id === "fBiz"){
    await saveBiz({name: f.elements.bname.value.trim(), currency: f.elements.currency.value.trim()}, "Datos guardados.");
  }
}
function validSlug(s){
  if (!/^[a-z0-9-]{3,30}$/.test(s)) return "El enlace debe tener 3 a 30 caracteres: letras minúsculas, números y guiones.";
  if (RESERVED.indexOf(s) >= 0) return "Ese enlace está reservado. Elige otro.";
  return "";
}

function adminRender(){

async function adminClick(e){
  const el = e.target.closest("[data-act]"); if (!el) return;

    }
    ctx.closePath();
  }

  function drawBell(alpha, c){
    var sx = S * J.bw, sy = S * .95 * J.bh;
    ctx.save();
    ctx.translate(J.x, J.y); ctx.rotate(J.tilt);
    ctx.globalCompositeOperation = "lighter";
    /* resplandor externo */
    bellPath(sx, sy);
    ctx.shadowColor = "rgba(90,150,255," + (.75*alpha).toFixed(2) + ")"; ctx.shadowBlur = S*.55;
    ctx.fillStyle = "rgba(80,130,255," + (.10*alpha).toFixed(3) + ")"; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
    /* cuerpo translucido */
    bellPath(sx, sy); ctx.save(); ctx.clip();
    var g = ctx.createRadialGradient(-sx*.15, -sy*.62, 0, 0, -sy*.25, sx*1.25);
    g.addColorStop(0, "rgba(245,250,255," + (.78*alpha) + ")");
    g.addColorStop(.2, "rgba(190,215,255," + (.52*alpha) + ")");
    g.addColorStop(.55, "rgba(80,135,255," + (.26*alpha) + ")");
    g.addColorStop(1, "rgba(25,55,170," + (.36*alpha) + ")");
    ctx.fillStyle = g; ctx.fillRect(-sx*1.3, -sy*1.3, sx*2.6, sy*1.6);
    /* canales radiales */
    ctx.lineWidth = 1; 
    for (var r = -8; r <= 8; r++){
      var tx = r * sx / 8.6;
      ctx.strokeStyle = "rgba(225,238,255," + (.20*alpha) + ")";
      ctx.beginPath(); ctx.moveTo(0, -sy*.98);
      ctx.quadraticCurveTo(tx*.55, -sy*.55, tx, 0); ctx.stroke();
    }
    /* gonadas: cuatro lobulos suaves en anillo */
    for (var q = 0; q < 4; q++){
      var ang = q * Math.PI/2 + Math.PI/4 + t*.15;
      var gx = Math.cos(ang) * S*.2*J.bw, gy = -sy*.36 + Math.sin(ang) * S*.075;
      var lg = ctx.createRadialGradient(gx, gy, 0, gx, gy, S*.15);
      lg.addColorStop(0, "rgba(255,230,236," + (.6*alpha) + ")");
      lg.addColorStop(.5, "rgba(255,95,120," + (.3*alpha) + ")");
      lg.addColorStop(1, "rgba(255,70,95,0)");
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(gx, gy, S*.15, 0, 6.29); ctx.fill();
    }
    var core = ctx.createRadialGradient(0, -sy*.34, 0, 0, -sy*.34, S*.6);
    core.addColorStop(0, "rgba(255,255,255," + (.42*alpha) + ")"); core.addColorStop(1, "rgba(120,170,255,0)");
    ctx.fillStyle = core; ctx.fillRect(-sx*1.3, -sy*1.3, sx*2.6, sy*1.6);
    /* reflejos rojos en los bordes */
    var rl = ctx.createRadialGradient(-sx*.78, sy*.02, 0, -sx*.78, sy*.02, S*.95);
    rl.addColorStop(0, "rgba(255,55,80," + (.5*alpha) + ")"); rl.addColorStop(1, "rgba(255,55,80,0)");
    ctx.fillStyle = rl; ctx.fillRect(-sx*1.3, -sy*1.3, sx*2.6, sy*1.6);
    var rr = ctx.createRadialGradient(sx*.82, -sy*.12, 0, sx*.82, -sy*.12, S*.75);
    rr.addColorStop(0, "rgba(255,70,95," + (.4*alpha) + ")"); rr.addColorStop(1, "rgba(255,70,95,0)");
    ctx.fillStyle = rr; ctx.fillRect(-sx*1.3, -sy*1.3, sx*2.6, sy*1.6);
    /* brillo especular */
    ctx.save(); ctx.translate(-sx*.38, -sy*.66); ctx.rotate(-.55); ctx.scale(1, .32);
    var sp = ctx.createRadialGradient(0,0,0,0,0,S*.5);
    sp.addColorStop(0, "rgba(255,255,255," + (.7*alpha) + ")"); sp.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sp; ctx.beginPath(); ctx.arc(0,0,S*.5,0,6.29); ctx.fill();
    ctx.restore();
    ctx.restore(); /* fin clip */
    /* borde luminoso */
    bellPath(sx, sy);
    ctx.strokeStyle = "rgba(235,245,255," + (.6*alpha) + ")"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, sx*.98, sy*.97, 0, Math.PI*.05, Math.PI*.42, false);
    ctx.strokeStyle = "rgba(255,70,95," + (.55*alpha) + ")"; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
  }

  function step(){
    t += 1/60;
    var doc = Math.max(1, document.documentElement.scrollHeight - H);
    var p = clamp((window.pageYOffset||0) / doc, 0, 1);
    var tx = mobile ? W*(.64 + Math.sin(p*9)*.06) : W*(.72 + Math.sin(p*9.4)*.09) + (mouse.x - .5) * W * .14;
    var ty = H*(.31 + .46*p) + clamp(sv * 1.6, -70, 70);
    tx = clamp(tx, S*1.1, W - S*1.1);
    J.vx += (tx - J.x) * .012; J.vy += (ty - J.y) * .012;
    J.vx *= .92; J.vy *= .92;
    J.x += J.vx; J.y += J.vy;
    J.tilt += (clamp(J.vx*.05, -.28, .28) - J.tilt) * .1;
    var speed = 1 + Math.min(Math.abs(sv) * .05, 3.2);
    J.ph += .045 * speed;
    var c = .5 + .5*Math.sin(J.ph);
    J.bw = 1 - .10*c; J.bh = 1 + .13*c;
    sv *= .9;
    J.alpha = clamp(1 - p*6, 0, 1)*.4 + .6;
    if (mobile) J.alpha *= .38;
    var wind = { x: -J.vx*.05, y: -J.vy*.035 };
    var by = J.y;
    for (var i = 0; i < tent.length; i++) update(tent[i], J.x, by, wind);
    for (var k = 0; k < arms.length; k++) update(arms[k], J.x, by, wind);
  }

  function frame(){
    step();
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < tent.length; i++) drawChain(tent[i], J.alpha);
    for (var k = 0; k < arms.length; k++) drawChain(arms[k], J.alpha);
    drawBell(J.alpha);
    ctx.globalCompositeOperation = "source-over";
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce){ for (var w = 0; w < 160; w++) step(); }
  frame();
})();

})();

</script>
